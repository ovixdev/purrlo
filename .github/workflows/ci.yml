# PRD §9: lint, L1 + L2 with the 85% coverage gate, E2E build, L3 scenarios (E2E-1 to E2E-10 and E2E-13).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (SwiftFormat, SwiftLint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same versions as `make bootstrap` installs locally; images pinned by digest.
      - name: SwiftFormat 0.64.0
        run: >
          docker run --rm -v "$PWD:/work" -w /work
          ghcr.io/nicklockwood/swiftformat:0.64.0@sha256:0f72f7dfda702f26bbf770a8a6802b907a2d95251458ed992565e45c94e13c4b
          --lint .
      - name: SwiftLint 0.65.1
        run: >
          docker run --rm -v "$PWD:/work" -w /work
          ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
          swiftlint lint --strict --quiet

  macos:
    # One macOS job: runner minutes are the expensive part, and BlackHole is installed once for L2 and L3.
    name: Tests and E2E (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the Xcode in .xcode-version
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app" && make check-xcode
      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Set up the CI test environment (BlackHole)
        run: scripts/e2e/setup-ci.sh

      # App compile errors surface here, before the slower package tests.
      - name: Build the E2E app
        run: make build-e2e

      - name: L1 + L2 with the 85% coverage gate
        run: make test
      - name: Export coverage
        if: always()
        run: cp "$(swift test --package-path Packages/KeepAliveCore --show-codecov-path)" coverage.json || true

      - name: NFR-10 Release build has no test hooks
        run: make check-release

      - name: L3 E2E-1 to E2E-10 and E2E-13
        run: make e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts
          path: |
            build/e2e-artifacts
            coverage.json
          if-no-files-found: warn
          retention-days: 14
