# XcodeGen spec (PRD §6, §9). Purrlo.xcodeproj is generated by `make generate` and never committed.
name: Purrlo

options:
  bundleIdPrefix: io.github.ovixdev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  # Release optimisation plus the test hooks; ad-hoc signed, needs no secrets (PRD §10).
  E2E: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
  configs:
    E2E:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: E2E_HOOKS

packages:
  KeepAliveCore:
    path: Packages/KeepAliveCore

targets:
  Purrlo:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Tools/E2EProtocol
      - path: Resources
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: KeepAliveCore
    settings:
      base:
        PRODUCT_NAME: Purrlo
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ovixdev.purrlo
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Purrlo.entitlements
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Separate identity so E2E runs never touch a real install's settings, socket or login item.
        E2E:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.ovixdev.purrlo.e2e

  kactl:
    type: tool
    platform: macOS
    sources:
      - path: Tools/kactl
        excludes:
          - Info.plist
      - path: Tools/E2EProtocol
    settings:
      base:
        PRODUCT_NAME: kactl
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ovixdev.purrlo.kactl
        INFOPLIST_FILE: Tools/kactl/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: E2E_HOOKS

schemes:
  Purrlo:
    build:
      targets:
        Purrlo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Purrlo-E2E:
    build:
      targets:
        Purrlo: all
        kactl: all
    run:
      config: E2E
    test:
      config: E2E
    profile:
      config: E2E
    analyze:
      config: E2E
    archive:
      config: E2E
